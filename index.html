<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currently Building</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a1a, #2d1b69, #1e1e2e, #0f0f23);
            background-size: 200% 200%;
            animation: gradientShift 15s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            100% {
                background-position: 0% 0%;
            }
        }

        /* Matrix grid canvas */
        #matrix-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
        }

        /* Coordinates display */
        .coordinates {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            color: #8a2be2;
            font-size: 16px;
            font-weight: 700;
            z-index: 10;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
            letter-spacing: 1px;
        }

        .container {
            text-align: center;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 700;
            color: #e0e0e0;
            text-shadow: 0 2px 8px rgba(138, 43, 226, 0.3);
            margin-bottom: 1rem;
            animation: fadeInUp 2s ease-out;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            font-weight: 400;
            color: #a0a0a0;
            text-shadow: 0 1px 4px rgba(138, 43, 226, 0.2);
            animation: fadeInUp 2s ease-out 0.3s both;
            letter-spacing: 3px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(138, 43, 226, 0.4);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            top: 20%;
            left: 20%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            top: 60%;
            left: 80%;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            top: 80%;
            left: 30%;
            animation-delay: 4s;
        }

        .particle:nth-child(4) {
            top: 30%;
            left: 70%;
            animation-delay: 1s;
        }

        .particle:nth-child(5) {
            top: 70%;
            left: 10%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-10px);
                opacity: 0.6;
            }
        }

        /* Overlay for additional depth */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
            z-index: 1;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                letter-spacing: -1px;
            }
            
            .subtitle {
                letter-spacing: 0.5px;
            }
        }
    </style>
</head>
<body>
    <!-- Matrix grid background -->
    <canvas id="matrix-grid"></canvas>
    
    <!-- Mouse coordinates display -->
    <div class="coordinates">[0.000, 0.000]</div>
    
    <div class="overlay"></div>
    
    <!-- Floating particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="container">
        <h1>Currently Building</h1>
        <p class="subtitle">stay tuned</p>
    </div>

    <script>
        // Matrix grid setup
        const canvas = document.getElementById('matrix-grid');
        const ctx = canvas.getContext('2d');
        const coordinatesDisplay = document.querySelector('.coordinates');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Draw matrix grid
        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.15)';
            ctx.lineWidth = 1;
            
            const gridSize = 30;
            
            // Vertical lines
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // Horizontal lines
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        drawGrid();
        window.addEventListener('resize', drawGrid);

        // Mouse coordinate tracking
        document.addEventListener('mousemove', (e) => {
            // Normalize coordinates (0.000 to 1.000)
            const normalizedX = (e.clientX / window.innerWidth).toFixed(3);
            const normalizedY = (e.clientY / window.innerHeight).toFixed(3);
            
            coordinatesDisplay.textContent = `[${normalizedX}, ${normalizedY}]`;
            
            // Existing particle movement code
            const particles = document.querySelectorAll('.particle');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            particles.forEach((particle, index) => {
                const speed = (index + 1) * 0.01;
                const xPos = x * speed * 20;
                const yPos = y * speed * 20;
                
                particle.style.transform = `translate(${xPos}px, ${yPos}px)`;
            });
        });

        // Add subtle click effect
        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.style.position = 'absolute';
            ripple.style.borderRadius = '50%';
            ripple.style.background = 'rgba(138, 43, 226, 0.2)';
            ripple.style.transform = 'scale(0)';
            ripple.style.animation = 'ripple 1s ease-out';
            ripple.style.left = (e.clientX - 25) + 'px';
            ripple.style.top = (e.clientY - 25) + 'px';
            ripple.style.width = '50px';
            ripple.style.height = '50px';
            ripple.style.pointerEvents = 'none';
            ripple.style.zIndex = '9999';
            
            document.body.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 1000);
        });

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(3);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
